<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm ivory background circle -->
  <circle cx="32" cy="32" r="32" fill="#F8F4EE"/>

  <!-- Perfume bottle body -->
  <rect x="20" y="30" width="24" height="26" rx="5" fill="#C6A15B"/>
  <rect x="22" y="32" width="20" height="22" rx="4" fill="#E8D5B0"/>

  <!-- Bottle neck -->
  <rect x="26" y="22" width="12" height="10" rx="3" fill="#C6A15B"/>
  <rect x="27" y="23" width="10" height="8" rx="2" fill="#E8D5B0"/>

  <!-- Bottle cap -->
  <rect x="24" y="17" width="16" height="7" rx="3" fill="#C6A15B"/>

  <!-- Spray nozzle -->
  <rect x="37" y="19" width="7" height="2.5" rx="1.2" fill="#C6A15B"/>
  <circle cx="44.5" cy="20.2" r="1.5" fill="#A07838"/>

  <!-- Label shine highlight -->
  <rect x="24" y="36" width="3" height="14" rx="1.5" fill="white" opacity="0.35"/>

  <!-- Floral accent dots on bottle -->
  <circle cx="32" cy="41" r="2" fill="#D8B8B0" opacity="0.8"/>
  <circle cx="32" cy="41" r="0.8" fill="#C6A15B"/>

  <!-- Small scent sparkles -->
  <circle cx="46" cy="13" r="1.5" fill="#C6A15B" opacity="0.7"/>
  <circle cx="50" cy="18" r="1" fill="#D8B8B0" opacity="0.6"/>
  <circle cx="43" cy="9"  r="1" fill="#C6A15B" opacity="0.5"/>
</svg>